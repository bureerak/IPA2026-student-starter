[routers]
target

[routers:vars]
; The router address and credentials arrive at run time:
; ansible_host comes from the extra-vars passed by the backend, and the
; credentials come from the environment. No secrets are stored in this file.
ansible_host={{ router }}
ansible_user={{ lookup('env', 'ROUTER_USER') }}
ansible_password={{ lookup('env', 'ROUTER_PASS') }}
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_command_timeout=30
ansible_connect_timeout=15
