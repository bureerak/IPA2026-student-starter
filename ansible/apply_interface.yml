---
# Apply the complete desired Loopback state for IPA2026 Part 3.
#
# Required extra-vars (supplied by app/backends/ansible.py):
#   router, interface_name, description, ipv4_address, netmask, shutdown
- name: Apply desired interface state
  hosts: routers
  gather_facts: false

  tasks:
    - name: Configure the Loopback interface
      cisco.ios.ios_config:
        defaults: true
        parents: "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if shutdown | bool else 'no shutdown' }}"
